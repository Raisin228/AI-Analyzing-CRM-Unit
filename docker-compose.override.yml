# Dev overrides — применяются автоматически поверх docker-compose.yml
# Монтируем локальный код в контейнер и включаем --reload

services:
  crm_mock:
    volumes:
      - ./services/crm_mock/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  analyzer:
    volumes:
      - ./services/analyzer/app:/app/app
      - ./services/analyzer/database:/app/database
      - ./services/analyzer/redis_service:/app/redis_service
      - ./services/analyzer/Embeddings:/app/Embeddings
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
