services:

  # База PostgreSQL для хранения сущностей
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # named volumes - Docker сам создаёт папку с данными и передаёт
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ] # Проверка работающей базы
      interval: 5s
      timeout: 5s
      retries: 10

  # Поднял Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Аналог kafka для упрощённой работы
  redpanda:
    image: redpandadata/redpanda:v23.3.21
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Локальная LLM
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "ollama serve & sleep 10 && ollama pull ${LLM} && wait" ] # стащили сразу же LLM
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Хранение данных langfuse
  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U langfuse" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Мониторинг и отладка LLM приложений
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=supersecretnextauthsecretatleast32ch
      - SALT=supersecretsaltatleast32chars1234
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3000/api/public/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # Модуль CRMки
  crm_mock:
    build:
      context: .
      dockerfile: services/crm_mock/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Интеллектуальный модуль анализатор
  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP=redpanda:9092
      - KAFKA_TOPIC=reviews.raw
      - CRM_URL=http://crm_mock:8000
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${LLM}
      - LANGFUSE_HOST=http://langfuse:3000
      - POLL_INTERVAL_SEC=30
      - RECURRENCE_THRESHOLD=0.85
      - ANOMALY_ZSCORE_THRESHOLD=2.5
      - ANOMALY_KL_THRESHOLD=0.5
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      crm_mock:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  langfuse_db_data:
  hf_cache:
